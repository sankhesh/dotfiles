# gpg-agent configuration
#
# Apply changes without restarting: gpgconf --reload gpg-agent

# Seconds a cached passphrase stays valid after its last use (default: 600 = 10 min).
# Each use resets this timer.
default-cache-ttl 28800

# Maximum seconds a passphrase stays cached regardless of use (default: 7200 = 2 hrs).
max-cache-ttl 86400

# Required for `--pinentry-mode loopback` used by git/gpg2-display-aware.zsh over SSH
allow-loopback-pinentry
